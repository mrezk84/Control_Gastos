# Render Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  # FastAPI Backend Service (Docker)
  - type: pserv
    name: control-gastos-backend
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /

    # Docker configuration
    dockerContext: .
    dockerfilePath: Dockerfile

    # Auto-deploy from main branch
    branch: main

    # Environment Variables
    envVars:
      - key: PORT
        value: 8000
      # These will be linked to the database service
      - key: DATABASE_URL
        fromDatabase:
          name: control-gastos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://control-gastos-frontend.onrender.com

databases:
  # PostgreSQL Database
  - name: control-gastos-db
    databaseName: control_gastos
    user: controluser
    plan: free
    region: oregon
