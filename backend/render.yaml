# Render Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  # FastAPI Backend Service (Docker)
  - type: pserv
    name: control-gastos-backend
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /

    # Docker configuration
    dockerContext: .
    dockerfilePath: Dockerfile

    # Auto-deploy from main branch
    branch: main

    # Environment Variables
    envVars:
      - key: PORT
        value: 8000
      # Supabase: configurar los valores en el dashboard de Render
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://control-gastos-frontend.vercel.app
