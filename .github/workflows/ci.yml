name: CI

# Vercel (frontend y backend, dos proyectos) está conectado directamente a este
# repo con su propia integración de git y despliega en cada push a main:
# no hace falta un paso de deploy aquí. Este workflow solo corre chequeos de
# build para que los pushes fallen rápido antes de que Vercel los tome.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # la misma que usa Vercel (backend/.python-version)

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Import check (catches missing deps / syntax errors)
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
          SECRET_KEY: "ci-placeholder-no-es-un-secreto"
        run: python -c "from app.main import app; print('Backend imports OK')"

      - name: Tests
        # Las pruebas fijan sus propias variables de entorno (ver tests/conftest.py)
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # Vitest 5 y Vite 8 la requieren (frontend/package.json "engines")
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        # TZ al oeste de UTC: es donde las fechas YYYY-MM-DD se mostraban un día antes
        env:
          TZ: America/Montevideo
        run: npm test

      - name: Build
        run: npm run build

  # Bloquea el PR si aparece un aviso de severidad alta o crítica en las dependencias de producción.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=high
