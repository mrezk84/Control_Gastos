name: CI

# Vercel (frontend y backend, dos proyectos) está conectado directamente a este
# repo con su propia integración de git y despliega en cada push a main:
# no hace falta un paso de deploy aquí. Este workflow solo corre chequeos de
# build para que los pushes fallen rápido antes de que Vercel los tome.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check (catches missing deps / syntax errors)
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
          SECRET_KEY: "ci-placeholder-no-es-un-secreto"
        run: python -c "from app.main import app; print('Backend imports OK')"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        # TZ al oeste de UTC: es donde las fechas YYYY-MM-DD se mostraban un día antes
        env:
          CI: true
          TZ: America/Argentina/Buenos_Aires
        run: npm test -- --watchAll=false

      - name: Build
        env:
          CI: false
        run: npm run build
