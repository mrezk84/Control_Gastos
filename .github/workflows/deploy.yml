name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BACKEND_SERVICE_NAME: control-gastos-backend
  FRONTEND_SERVICE_NAME: control-gastos-frontend
  REGION: us-central1

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Backend Docker image
        run: |
          IMAGE_URL="us-central1-docker.pkg.dev/$PROJECT_ID/control-gastos/backend:${{ github.sha }}"
          docker build -t $IMAGE_URL ./backend
          docker push $IMAGE_URL
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE_NAME \
            --image=$IMAGE_URL \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }},GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }},GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" \
            --port=8000

      - name: Show Backend URL
        run: |
          SERVICE_URL=$(gcloud run services describe $BACKEND_SERVICE_NAME --region=$REGION --format='value(status.url)')
          echo "Backend deployed to: $SERVICE_URL"

  deploy-frontend:
    runs-on: ubuntu-latest

    needs: deploy-backend

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Frontend Docker image
        run: |
          IMAGE_URL="us-central1-docker.pkg.dev/$PROJECT_ID/control-gastos/frontend:${{ github.sha }}"
          docker build -t $IMAGE_URL ./frontend
          docker push $IMAGE_URL
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE_NAME \
            --image=$IMAGE_URL \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --port=80

      - name: Show Frontend URL
        run: |
          SERVICE_URL=$(gcloud run services describe $FRONTEND_SERVICE_NAME --region=$REGION --format='value(status.url)')
          echo "Frontend deployed to: $SERVICE_URL"
